name: immich
services:
  telegram-immich-bot:
    image: immichtelebot:latest
    container_name: telegram-immich-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=111111111111:111111111111111
      - IMMICH_URL=https://immich.example.org
      - IMPORT_DIR=/import
      - TZ=Europe/Moscow
      - TELEGRAM_API_ID=1111111111
      - TELEGRAM_API_HASH=111111111111111
      - LOCK_FILE_PATH=/import/lock.lock
      - LOCK_TIMEOUT=60
      - LOCK_CHECK_INTERVAL=20
      - MAX_CONCURRENT_TELETHON_DOWNLOADS=4   # ↓ до 2 при слабом канале
      - MAX_CONCURRENT_EXTRACTS=2             # ↓ до 1 при медленном диске
      - MAX_CONCURRENT_UPLOADS=6
      - MAX_CONCURRENT_UPLOADS_PER_JOB=3
      - MAX_CONCURRENT_JOBS_PER_USER=2
      - IO_MAX_WORKERS=16
      - CPU_MAX_WORKERS=4
      - TEMP_DIR=/tmp/bot_downloads_${HOSTNAME}
    volumes:
      - /immich/telegrambot:/import
      - ./telegram_session.session:/app/telegram_session.session

